<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixture - Torneo de Vóley Mixto</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff5722;
            --bg-dark: #121214;
            --card-bg: #1e1e24;
            --text-light: #f4f4f7;
            --text-muted: #a0a0b0;
            --accent-green: #25d366;
            --accent-green-dark: #1da851;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #ff5722, #ff8a65);
            border-radius: 16px;
        }

        header h1 {
            font-size: 1.6rem;
            text-transform: uppercase;
            font-weight: 800;
        }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .round-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .round-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            border-bottom: 2px solid rgba(255,87,34,0.3);
            padding-bottom: 6px;
            margin-top: 10px;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(255,255,255,0.03);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .team-row.winner {
            background-color: rgba(37, 211, 102, 0.15);
            border-color: var(--accent-green);
        }

        .team-row.loser {
            opacity: 0.4;
        }

        .team-name {
            font-size: 0.95Font;
            font-weight: 600;
        }

        .btn-win {
            background-color: rgba(255,255,255,0.1);
            color: var(--text-light);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-win:hover {
            background-color: var(--accent-green);
            color: white;
        }

        .team-row.winner .btn-win {
            background-color: var(--accent-green);
            color: white;
        }

        .equipos-cargados {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            font-size: 0.9rem;
        }

        .equipos-cargados ul {
            list-style: none;
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .equipos-cargados li {
            background-color: rgba(255,255,255,0.08);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .campeon-banner {
            background: linear-gradient(135deg, #25d366, #117a37);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🏆 Fixture del Torneo</h1>
            <p style="font-size: 0.85rem; margin-top: 4px;">Eliminación Directa en Vivo</p>
        </header>

        <button class="btn-action" onclick="cargarYGenerarFixture()">🔄 Sortear y Reiniciar Torneo</button>

        <div class="equipos-cargados" id="seccionEquipos" style="display: none;">
            <strong>Equipos participantes (<span id="totalEquipos">0</span>):</strong>
            <ul id="listaEquipos"></ul>
        </div>

        <div id="contenedorFases"></div>
    </div>

    <script>
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbxl43vb9Wtb6deiHBM0r4r2T8H9iTNiR6G_fdxYEoM7fNVUhq4umFDrVBDNyCLWc6ApPg/exec";

        let fasesTorneo = [];

        async function cargarYGenerarFixture() {
            const contenedor = document.getElementById('contenedorFases');
            contenedor.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Cargando equipos desde Drive...</p>';

            try {
                const response = await fetch(URL_GOOGLE_SCRIPT);
                const data = await response.json();

                if (!data || data.length === 0) {
                    contenedor.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No hay equipos inscriptos todavía.</p>';
                    return;
                }

                let nombresEquipos = data.map(item => item.nombreEquipo);

                document.getElementById('totalEquipos').innerText = nombresEquipos.length;
                const ul = document.getElementById('listaEquipos');
                ul.innerHTML = '';
                nombresEquipos.forEach(eq => {
                    const li = document.createElement('li');
                    li.innerText = eq;
                    ul.appendChild(li);
                });
                document.getElementById('seccionEquipos').style.display = 'block';

                // Sorteo aleatorio
                nombresEquipos.sort(() => Math.random() - 0.5);

                // Inicializar primera fase
                fasesTorneo = [{
                    nombreRonda: nombresEquipos.length > 4 ? "Cuartos de Final" : (nombresEquipos.length > 2 ? "Semifinales" : "Final"),
                    partidos: []
                }];

                if (nombresEquipos.length % 2 !== 0) {
                    nombresEquipos.push("PASA DIRECTO (Libre)");
                }

                for (let i = 0; i < nombresEquipos.length; i += 2) {
                    fasesTorneo[0].partidos.push({
                        id: 'r0_p' + (fasesTorneo[0].partidos.length + 1),
                        eq1: nombresEquipos[i],
                        eq2: nombresEquipos[i+1],
                        ganador: null
                    });
                }

                renderizarTorneo();

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = '<p style="text-align: center; color: #ff5252;">Error al conectar con la base de datos.</p>';
            }
        }

        function seleccionarGanador(rondaIndex, partidoIndex, equipoGanador) {
            const partido = fasesTorneo[rondaIndex].partidos[partidoIndex];
            
            // Si ya tenía un ganador, permitimos cambiarlo o lo establecemos
            partido.ganador = equipoGanador;

            // Verificamos si todos los partidos de la ronda actual tienen ganador
            verificarAvanzarRonda(rondaIndex);
            renderizarTorneo();
        }

        function verificarAvanzarRonda(rondaIndex) {
            const rondaActual = fasesTorneo[rondaIndex];
            const todosDefinidos = rondaActual.partidos.every(p => p.ganador !== null);

            if (todosDefinidos) {
                // Recolectar ganadores
                const ganadores = rondaActual.partidos.map(p => p.ganador);

                // Si queda más de un ganador, creamos la siguiente ronda
                if (ganadores.length > 1) {
                    // Si ya existe la siguiente ronda, la pisamos/actualizamos
                    const siguienteRondaNombre = ganadores.length > 2 ? "Semifinales" : "Gran Final";
                    
                    const nuevosPartidos = [];
                    for (let i = 0; i < ganadores.length; i += 2) {
                        nuevosPartidos.push({
                            id: `r${rondaIndex+1}_p` + (nuevosPartidos.length + 1),
                            eq1: ganadores[i],
                            eq2: ganadores[i+1] || "LIBRE",
                            ganador: null
                        });
                    }

                    // Cortamos fases posteriores si existían y agregamos la nueva
                    fasesTorneo = fasesTorneo.slice(0, rondaIndex + 1);
                    fasesTorneo.push({
                        nombreRonda: siguienteRondaNombre,
                        partidos: nuevosPartidos
                    });
                }
            }
        }

        function renderizarTorneo() {
            const contenedor = document.getElementById('contenedorFases');
            contenedor.innerHTML = '';

            fasesTorneo.forEach((ronda, rIndex) => {
                const rondaDiv = document.createElement('div');
                rondaDiv.className = 'round-section';

                const titulo = document.createElement('div');
                titulo.className = 'round-title';
                titulo.innerText = ronda.nombreRonda;
                rondaDiv.appendChild(titulo);

                ronda.partidos.forEach((partido, pIndex) => {
                    const card = document.createElement('div');
                    card.className = 'match-card';

                    const isEq1Winner = partido.ganador === partido.eq1;
                    const isEq2Winner = partido.ganador === partido.eq2;

                    card.innerHTML = `
                        <div class="match-header">
                            <span>Partido ${pIndex + 1}</span>
                            <span>${partido.ganador ? '✅ Definido' : '⏳ En juego'}</span>
                        </div>
                        <div class="team-row ${isEq1Winner ? 'winner' : (partido.ganador ? 'loser' : '')}">
                            <span class="team-name">🏐 ${partido.eq1}</span>
                            <button class="btn-win" onclick="seleccionarGanador(${rIndex}, ${pIndex}, '${partido.eq1}')">
                                ${isEq1Winner ? 'Ganador' : 'Marcar Ganador'}
                            </button>
                        </div>
                        <div class="team-row ${isEq2Winner ? 'winner' : (partido.ganador ? 'loser' : '')}">
                            <span class="team-name">🏐 ${partido.eq2}</span>
                            <button class="btn-win" onclick="seleccionarGanador(${rIndex}, ${pIndex}, '${partido.eq2}')">
                                ${isEq2Winner ? 'Ganador' : 'Marcar Ganador'}
                            </button>
                        </div>
                    `;
                    rondaDiv.appendChild(card);
                });

                contenedor.appendChild(rondaDiv);
            });

            // Si llegamos a la final y hay un ganador definitivo
            const ultimaRonda = fasesTorneo[fasesTorneo.length - 1];
            if (ultimaRonda.nombreRonda === "Gran Final" && ultimaRonda.partidos.length === 1 && ultimaRonda.partidos[0].ganador !== null) {
                const campeon = ultimaRonda.partidos[0].ganador;
                const banner = document.createElement('div');
                banner.className = 'campeon-banner';
                banner.innerHTML = `
                    <h2 style="font-size: 1.5rem; margin-bottom: 6px;">🎉 ¡CAMPEÓN DEL TORNEO! 🎉</h2>
                    <p style="font-size: 1.2rem; font-weight: 800;">${campeon}</p>
                `;
                contenedor.appendChild(banner);
            }
        }
    </script>
</body>
</html>
